    <text x="60" y="610" fill="#6d7b71" font-size="13">arthur.run/solarpunk-drill-power-calculator</text>
    <text x="1140" y="610" fill="#205f46" font-size="13" font-weight="700" text-anchor="end">Open source on GitHub</text>
  </g>
