<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ed" />
      <stop offset="1" stop-color="#eef6ef" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4d391e" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1080" cy="70" r="230" fill="#58b7c6" opacity="0.08" />
  <circle cx="75" cy="605" r="240" fill="#2e805c" opacity="0.07" />

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="112" fill="#263b2f" font-size="57" font-weight="800" letter-spacing="-1.8">Solarpunk Drill</text>
    <text x="58" y="171" fill="#263b2f" font-size="57" font-weight="800" letter-spacing="-1.8">Power Calculator</text>
    <text x="60" y="219" fill="#5a351f" font-size="22" font-weight="700">See what your grid needs and what to build next.</text>

    <g transform="translate(863 42)">
      <image x="0" y="0" width="132" height="132" preserveAspectRatio="xMidYMid meet" xlink:href="https://assets.solarpunkwiki.com/icons/art/ICON_Solarpanel.webp" />
      <image x="92" y="4" width="132" height="132" preserveAspectRatio="xMidYMid meet" xlink:href="https://assets.solarpunkwiki.com/icons/art/Icon_Drill.webp" />
      <image x="187" y="9" width="126" height="126" preserveAspectRatio="xMidYMid meet" xlink:href="https://assets.solarpunkwiki.com/icons/art/Icon_Battery.webp" />
      <path d="M4 144 H306" stroke="#58b7c6" stroke-width="4" />
    </g>

    <g transform="translate(58 286)" filter="url(#shadow)">
      <rect width="1084" height="286" rx="18" fill="#fffaf1" stroke="#dfc38d" />
      <text x="28" y="43" fill="#263b2f" font-size="22" font-weight="800">Default balanced upgrade flow</text>

      <g transform="translate(664 20)">
        <rect width="126" height="31" rx="16" fill="#e7f2e9" />
        <text x="63" y="21" fill="#205f46" font-size="12" font-weight="700" text-anchor="middle">CLOUDY BASELINE</text>
        <rect x="136" width="123" height="31" rx="16" fill="#e8f5f5" />
        <text x="197.5" y="21" fill="#205f46" font-size="12" font-weight="700" text-anchor="middle">10 MIN BUFFER</text>
        <rect x="269" width="123" height="31" rx="16" fill="#fff0cf" />
        <text x="330.5" y="21" fill="#8a5a18" font-size="12" font-weight="700" text-anchor="middle">6 DRILL GOAL</text>
      </g>

      <line x1="30" y1="63" x2="1054" y2="63" stroke="#ead9b5" />

      <g transform="translate(28 85)">
        <g transform="translate(0 0)">
          <rect width="155" height="166" rx="13" fill="#f6ecd7" stroke="#dfc38d" />
          <circle cx="24" cy="24" r="14" fill="#fffaf1" stroke="#dfc38d" />
          <text x="24" y="29" fill="#5a351f" font-size="14" font-weight="800" text-anchor="middle">1</text>
          <image x="38" y="25" width="80" height="80" preserveAspectRatio="xMidYMid meet" xlink:href="https://assets.solarpunkwiki.com/icons/art/Icon_Battery.webp" />
          <text x="77.5" y="126" fill="#263b2f" font-size="16" font-weight="800" text-anchor="middle">Battery</text>
          <text x="77.5" y="148" fill="#6d7b71" font-size="12" text-anchor="middle">Weather buffer</text>
        </g>

        <text x="170" y="90" fill="#ad7428" font-size="24" font-weight="700">›</text>

        <g transform="translate(187 0)">
          <rect width="155" height="166" rx="13" fill="#fffaf1" stroke="#dfc38d" />
          <circle cx="24" cy="24" r="14" fill="#fffaf1" stroke="#dfc38d" />
          <text x="24" y="29" fill="#5a351f" font-size="14" font-weight="800" text-anchor="middle">2</text>
          <image x="38" y="25" width="80" height="80" preserveAspectRatio="xMidYMid meet" xlink:href="https://assets.solarpunkwiki.com/icons/art/ICON_Solarpanel.webp" />
          <text x="77.5" y="126" fill="#263b2f" font-size="16" font-weight="800" text-anchor="middle">Solar Panel</text>
          <text x="77.5" y="148" fill="#6d7b71" font-size="12" text-anchor="middle">Recover buffer</text>
        </g>

        <text x="357" y="90" fill="#ad7428" font-size="24" font-weight="700">›</text>

        <g transform="translate(374 0)">
          <rect width="155" height="166" rx="13" fill="#fffaf1" stroke="#dfc38d" />
          <circle cx="24" cy="24" r="14" fill="#fffaf1" stroke="#dfc38d" />
          <text x="24" y="29" fill="#5a351f" font-size="14" font-weight="800" text-anchor="middle">3</text>
          <image x="38" y="25" width="80" height="80" preserveAspectRatio="xMidYMid meet" xlink:href="https://assets.solarpunkwiki.com/icons/art/ICON_Solarpanel.webp" />
          <text x="77.5" y="126" fill="#263b2f" font-size="16" font-weight="800" text-anchor="middle">Solar Panel</text>
          <text x="77.5" y="148" fill="#6d7b71" font-size="12" text-anchor="middle">Prepare power</text>
        </g>

        <text x="544" y="90" fill="#ad7428" font-size="24" font-weight="700">›</text>

        <g transform="translate(561 0)">
          <rect width="155" height="166" rx="13" fill="#e7f2e9" stroke="#8bbfa2" stroke-width="2" />
          <circle cx="24" cy="24" r="14" fill="#fffaf1" stroke="#8bbfa2" />
          <text x="24" y="29" fill="#205f46" font-size="14" font-weight="800" text-anchor="middle">4</text>
          <image x="38" y="25" width="80" height="80" preserveAspectRatio="xMidYMid meet" xlink:href="https://assets.solarpunkwiki.com/icons/art/Icon_Drill.webp" />
          <text x="77.5" y="126" fill="#263b2f" font-size="16" font-weight="800" text-anchor="middle">Drill #2</text>
          <text x="77.5" y="148" fill="#205f46" font-size="12" font-weight="700" text-anchor="middle">Production online</text>
        </g>

        <text x="731" y="90" fill="#ad7428" font-size="24" font-weight="700">›</text>

        <g transform="translate(748 0)">
          <rect width="155" height="166" rx="13" fill="#fffaf1" stroke="#dfc38d" />
          <circle cx="24" cy="24" r="14" fill="#fffaf1" stroke="#dfc38d" />
          <text x="24" y="29" fill="#5a351f" font-size="14" font-weight="800" text-anchor="middle">5</text>
          <image x="38" y="25" width="80" height="80" preserveAspectRatio="xMidYMid meet" xlink:href="https://assets.solarpunkwiki.com/icons/art/Icon_Battery.webp" />
          <text x="77.5" y="126" fill="#263b2f" font-size="16" font-weight="800" text-anchor="middle">Battery</text>
          <text x="77.5" y="148" fill="#6d7b71" font-size="12" text-anchor="middle">Protect new load</text>
        </g>

        <text x="918" y="90" fill="#ad7428" font-size="24" font-weight="700">›</text>

        <g transform="translate(935 0)">
          <rect width="93" height="166" rx="13" fill="#f6ecd7" stroke="#dfc38d" stroke-dasharray="6 5" />
          <text x="46.5" y="74" fill="#263b2f" font-size="30" font-weight="800" text-anchor="middle">+19</text>
          <text x="46.5" y="104" fill="#6d7b71" font-size="13" font-weight="700" text-anchor="middle">builds</text>
        </g>
